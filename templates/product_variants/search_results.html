{% if variants.is_empty() %}
    <div class="search-dropdown-item no-results">
        <span>لا توجد نتائج تطابق "{{ query }}"</span>
    </div>
{% else %}
   {% for variant in variants %}
    <a href="/web/products_variants/{{ variant.id }}/edit" class="search-dropdown-item">
        <span class="item-name-ar" title="{{variant.id}}">{{ variant.name_ar }}</span>
        {# <span class="item-name-en">{{ brand.name_en }}</span> #}
    </a>
{% endfor %}
{% endif %}
